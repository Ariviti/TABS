name: Deploy Brand Site

# Runs on every push to main. This is the ONLY way the public site
# is ever updated — nobody edits the deployed site directly. Source
# of truth is always the .md files in repo root; this workflow reads
# them, redacts anything marked PRIVATE, builds, and publishes.
on:
  push:
    branches: [main]
  workflow_dispatch:   # allows a manual re-run from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private source repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs + Material theme
        run: pip install mkdocs-material

      - name: Redact PRIVATE-marked content
        run: python3 scripts/redact_private.py
        # This writes to ./docs/ — a gitignored build folder.
        # If this step doesn't run, mkdocs has nothing to build from.

      - name: Fail the build if any PRIVATE marker survived redaction
        run: |
          if grep -rl "PRIVATE:" docs/ ; then
            echo "::error::Unredacted PRIVATE content detected in build output. Aborting deploy."
            exit 1
          fi

      - name: Build static site
        run: mkdocs build --strict

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
