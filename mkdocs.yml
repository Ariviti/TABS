site_name: Ariviti Brand System
site_description: TABS — The Ariviti Brand System. Logo, color, typography, voice, and templates.
site_url: https://tabs.ariviti.com


markdown_extensions:
  - tables
  - toc:
      permalink: true
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Brand Physics: 00_STRING_Governance/00_ATOMIC_TABS_Intro.md
  - Strings (Rules): 00_STRING_Governance/00_STRING_Governance.md
  - Particles (Colors, Fonts): 00_STRING_Governance/01_PARTICLE_Color_Typefaces.md
  - Atoms (Core Logos & Images): 00_STRING_Governance/02_ATOMS_Logos_Imagery.md
  - Molecules (Other Logos & Templates): 00_STRING_Governance/03_MOLECULE_Logos_Templates.md
  - Compounds (References): 00_STRING_Governance/05_COMPOUND_Identity_References.md

extra:
  cdn_url: "https://cdn.ariviti.com/tabs"

theme:
  name: material
  logo: 02_ATOM_Logo_Core/PNG/logo_full_light_3237x1202.png  # White/Light logo for dark background
  favicon: 02_ATOM_Logo_Core/PNG/logo_symbol_dark_1202x1202.png
  font: false

  # Single Slate Theme (No dark/light toggle button)
  palette:
    scheme: slate
    primary: custom
    accent: custom

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - toc.integrate
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

extra_css:
  - scripts/ariviti-tokens.css


extra_javascript:
  - scripts/file-browser.js
 