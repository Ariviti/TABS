site_name: TABS
site_description: TABS — The Ariviti Brand System. Logo, color, typography, voice, and templates.
site_url: https://tabs.ariviti.com

docs_dir: _build

markdown_extensions:
  - attr_list            # Enables inline image sizing and CSS class attributes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - TABS Home: index.md
  - Brand Physics: 00_STRING_Governance/00_ATOMIC_TABS_Intro.md
  - Strings / Rules: 00_STRING_Governance/00_STRING_Governance.md
  - Particles / Colors & Fonts: 00_STRING_Governance/01_PARTICLE_Color_Typefaces.md
  - Atoms / Core Logos & Images: 00_STRING_Governance/02_ATOMS_Logos_Imagery.md
  - Molecules / Other Logos & Templates: 00_STRING_Governance/03_MOLECULE_Logos_Templates.md
  - Compounds / References: 00_STRING_Governance/04_COMPOUND_Identity_References.md

extra:
  cdn_url: "https://cdn.ariviti.com/tabs"
  generator: false

# Add copyright here at the root level:
copyright: "Copyright &copy; 2026 Ariviti Technologies. All rights reserved."

theme:
  name: material
  logo: https://cdn.ariviti.com/tabs/02_ATOM_Logo_Core/SVG/logo_full_light.svg
  favicon: https://cdn.ariviti.com/tabs/02_ATOM_Logo_Core/SVG/logo_symbol_light.svg
  font: false

  # Single Slate Theme (No dark/light toggle button)
  palette:
    scheme: slate
    primary: custom
    accent: custom

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - toc.integrate
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

extra_css:
  - ariviti-tokens.css


extra_javascript:
  - file-browser.js
 