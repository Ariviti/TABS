site_name: Ariviti Brand System
site_description: TABS — The Ariviti Brand System. Logo, color, typography, voice, and templates.
site_url: https://ariviti.github.io/TABS

theme:
  name: material
  logo: 02_ATOM_Logo_Core/PNG/logo_full_dark_3237x1202.png
  favicon: 02_ATOM_Logo_Core/PNG/logo_symbol_dark_1202x1202.png
  font: false
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.top
    - toc.integrate
    - search.suggest
    - content.code.copy

extra_css:
  - ariviti-tokens.css

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - System Map: 00_ATOMIC_TABS_Intro/00_ATOMIC_TABS_Intro.md
  - Strings (Rules): 00_STRING_Governance/00_STRING_Governance.md
  - Particles (Values):
      - Color, Type & Accessibility: 02_PARTICLE_Color_Typefaces/02_PARTICLE_Color_Typefaces.md
  - Atoms (Identity):
      - Logo & Photography: 02_ATOMS_Logos_Imagery/02_ATOMS_Logos_Imagery.md
  - Molecules (Build Manifest): 03_MOLECULE_Logos_Templates/03_MOLECULE_Logos_Templates.md
  - Compounds (Templates & Downloads): 05_COMPOUND_Identity_References/05_COMPOUND_Identity_References.md
  - Downloads: downloads.md